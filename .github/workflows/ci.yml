# Contrôle automatique d'ACAW : compile, teste et publie à chaque push et à chaque pull request.
# Explications pas à pas : docs/guide/08-strategie-de-test.md, section « Contrôle automatique ».
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # bouton « Run workflow » sur la page Actions

# Un nouveau push sur la même branche annule le contrôle encore en cours : inutile de finir l'ancien.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilation et tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer .NET (version fixée par global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurer les paquets NuGet
        run: dotnet restore ACAW.sln

      # -warnaserror : le moindre avertissement fait échouer le contrôle (on garde « 0 avertissement »).
      - name: Compiler (Release, avertissements = erreurs)
        run: dotnet build ACAW.sln -c Release --no-restore -warnaserror

      # Les tests fumée (Categorie=Windows) sont exclus : cette machine n'a ni Bluetooth ni carte son.
      # Ils se lancent sur un vrai PC avant chaque version.
      - name: Lancer les tests
        run: >
          dotnet test ACAW.sln -c Release --no-build
          --filter "Categorie!=Windows"
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults

      - name: Vérifier la couverture du cœur (seuil 90 %)
        shell: pwsh
        run: ./build/check-coverage.ps1 -ResultsDirectory TestResults -Package Acaw.Core -Threshold 90

      # Inno Setup compile l'installateur. Installé seulement s'il manque sur la machine de GitHub.
      - name: Installer Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Publication autonome, installateur, archive portable, empreintes : dans artifacts/.
      - name: Construire l'installateur
        shell: pwsh
        run: ./build/build-release.ps1

      # Installation et désinstallation silencieuses de bout en bout, sur la machine jetable de GitHub.
      - name: Tester l'installateur
        shell: pwsh
        run: ./build/test-installer.ps1 -Setup (Get-ChildItem artifacts/acaw-setup-*.exe).FullName

      # Téléchargeables depuis la page du contrôle, même en cas d'échec des tests (pour comprendre).
      - name: Joindre les résultats des tests et la couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultats-tests
          path: TestResults
          retention-days: 14

      - name: Joindre l'installateur et l'archive portable
        uses: actions/upload-artifact@v7
        with:
          name: acaw-windows
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.txt
          retention-days: 14
