# Contrôle automatique d'ACAW : compile et construit l'installateur à chaque push et à chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # bouton « Run workflow » sur la page Actions

# Un nouveau push sur la même branche annule le contrôle encore en cours : inutile de finir l'ancien.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilation et installateur (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer .NET (version fixée par global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurer les paquets NuGet
        run: dotnet restore ACAW.sln

      # -warnaserror : le moindre avertissement fait échouer le contrôle (on garde « 0 avertissement »).
      - name: Compiler (Release, avertissements = erreurs)
        run: dotnet build ACAW.sln -c Release --no-restore -warnaserror

      # Inno Setup compile l'installateur. Installé seulement s'il manque sur la machine de GitHub.
      - name: Installer Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Publication autonome, installateur, archive portable, empreintes : dans artifacts/.
      - name: Construire l'installateur
        shell: pwsh
        run: ./build/build-release.ps1

      - name: Joindre l'installateur et l'archive portable
        uses: actions/upload-artifact@v7
        with:
          name: acaw-windows
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.txt
          retention-days: 14
